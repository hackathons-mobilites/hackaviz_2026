<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hackathon Mobilités 2026 — Explorateur des projets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-2: #f8fafd;
      --surface-3: #eef5ff;
      --border: #dce5f0;
      --border-strong: #bfd0e4;
      --navy: #09315c;
      --text: #152538;
      --muted: #52657a;
      --accent: #1972d2;
      --accent-hover: #125aa8;
      --accent-soft: #deeeff;
      --d1-bg: #fff0db; --d1-fg: #ac5700;
      --d2-bg: #edfcf2; --d2-fg: #087443;
      --d3-bg: #deeeff; --d3-fg: #09315c;
      --d4-bg: #eeecfb; --d4-fg: #4f338b;
      --radius: 16px;
      --shadow-sm: 0 2px 8px rgba(9, 49, 92, 0.05);
      --shadow-md: 0 8px 24px rgba(9, 49, 92, 0.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* IDFM Institutional Header */
    header {
      background: var(--surface);
      border-top: 4px solid var(--accent);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .header-top {
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .brand:hover h1 { color: var(--accent); }
    .brand:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }
    .brand img {
      height: 30px;
      width: auto;
      display: block;
    }
    .brand-sep {
      width: 1px;
      height: 24px;
      background: var(--border);
    }
    .brand h1 {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--navy);
    }
    .badge-count {
      font-size: 0.76rem;
      font-weight: 700;
      background: var(--accent-soft);
      padding: 4px 12px;
      border-radius: 999px;
      color: var(--navy);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .idfm-btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1.5px solid var(--border-strong);
      color: var(--navy);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      background: var(--surface);
      transition: all 0.15s ease;
    }
    .idfm-btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--surface-3);
    }
    .idfm-btn-outline.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .filters-bar {
      padding: 10px 28px;
      background: var(--surface-2);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .pill {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.81rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill:hover { color: var(--navy); border-color: var(--accent); }
    .pill.active {
      background: var(--navy);
      color: #ffffff;
      border-color: var(--navy);
    }
    .search {
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      width: 240px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(25, 114, 210, 0.12);
    }

    /* Main Grid */
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 380px 1fr;
      min-height: 0;
    }

    /* Sidebar (IDFM button-card style) */
    aside {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      transition: all 0.18s ease;
    }
    .card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .card:hover .card-chevron {
      transform: translateX(3px);
    }
    .card.active {
      border-color: var(--accent);
      background: var(--surface-3);
      box-shadow: 0 0 0 1px var(--accent), var(--shadow-md);
    }
    .card-body {
      flex: 1;
      min-width: 0;
    }
    .card-chevron {
      flex-shrink: 0;
      transition: transform 0.18s ease;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 8px;
    }
    .team-num {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .defi-tag {
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.69rem;
    }
    .d1 { background: var(--d1-bg); color: var(--d1-fg); }
    .d2 { background: var(--d2-bg); color: var(--d2-fg); }
    .d3 { background: var(--d3-bg); color: var(--d3-fg); }
    .d4 { background: var(--d4-bg); color: var(--d4-fg); }
    .card-title {
      font-weight: 700;
      font-size: 0.92rem;
      line-height: 1.35;
      margin-bottom: 8px;
      color: var(--navy);
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 0.74rem;
      color: var(--muted);
    }
    .mini-chip {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 500;
    }
    .mini-chip.video {
      color: #ac5700;
      border-color: #fed7aa;
      background: #fff7ed;
      font-weight: 600;
    }
    .mini-chip.download {
      color: #0b5cab;
      border-color: #bfdbfe;
      background: #eff6ff;
      font-weight: 600;
    }

    /* Viewer Area */
    main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--bg);
    }
    .viewer-bar {
      padding: 16px 28px 0 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .viewer-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .viewer-info h2 {
      margin: 0 0 4px 0;
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--navy);
    }
    .viewer-info p {
      margin: 0;
      font-size: 0.84rem;
      color: var(--muted);
    }

    /* IDFM Portal Underline Tabs */
    .tabs-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn {
      padding: 10px 16px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s ease;
      margin-bottom: -1px;
    }
    .tab-btn:hover { color: var(--navy); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f59e0b;
      display: inline-block;
    }

    .ext-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1.5px solid var(--accent);
      color: var(--accent);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      background: var(--surface);
      transition: all 0.15s ease;
    }
    .ext-link:hover { background: var(--accent); color: #ffffff; }

    .idfm-btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 8px;
      border: 0;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .idfm-btn-primary:hover { background: var(--accent-hover); }

    /* Stage */
    .stage {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      position: relative;
    }

    /* Documentation View */
    .doc-container {
      max-width: 920px;
      margin: 24px auto;
      padding: 0 24px 48px 24px;
    }
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
    }
    .summary-card label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 5px;
    }
    .summary-card span {
      font-size: 0.86rem;
      line-height: 1.45;
      display: block;
      color: var(--navy);
      font-weight: 500;
    }

    .markdown-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px 36px;
      line-height: 1.7;
      font-size: 0.95rem;
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      color: var(--navy);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-top: 26px;
      font-weight: 800;
    }
    .markdown-body h1:first-child { margin-top: 0; }
    .markdown-body a { color: var(--accent); font-weight: 600; }
    .markdown-body code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.85em;
      color: var(--navy);
    }
    .markdown-body pre {
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      border-radius: 10px;
      overflow-x: auto;
    }
    .markdown-body pre code { background: none; padding: 0; color: inherit; }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 0.86rem;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border);
      padding: 9px 12px;
      text-align: left;
    }
    .markdown-body th { background: var(--surface-2); color: var(--navy); font-weight: 700; }
    .markdown-body img {
      max-width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .markdown-body blockquote {
      margin: 16px 0;
      padding: 10px 18px;
      border-left: 4px solid var(--accent);
      background: var(--surface-3);
      border-radius: 0 8px 8px 0;
      color: var(--navy);
    }

    /* Video View */
    .video-container {
      max-width: 960px;
      margin: 28px auto;
      padding: 0 24px;
    }
    .video-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow-sm);
    }
    .video-card video {
      width: 100%;
      max-height: 70vh;
      border-radius: 10px;
      background: #000;
      outline: none;
    }
    .video-caption {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Iframe View */
    .iframe-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .iframe-notice {
      padding: 9px 24px;
      background: var(--accent-soft);
      color: var(--navy);
      font-size: 0.8rem;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #bfdbfe;
      gap: 12px;
      flex-wrap: wrap;
    }
    .iframe-notice a { color: var(--accent); font-weight: 700; }
    iframe {
      width: 100%;
      flex: 1;
      border: 0;
      background: #ffffff;
    }

    /* Download panel (fichiers .pbix) */
    .download-panel {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 24px;
      background: #fff8e8;
      border-bottom: 1px solid #f0d49b;
    }
    .download-icon { font-size: 1.5rem; line-height: 1.2; }
    .download-content { flex: 1; min-width: 0; }
    .download-content h4 {
      margin: 0 0 4px;
      font-size: 0.93rem;
      color: var(--navy);
      font-weight: 800;
    }
    .download-content p {
      margin: 0 0 6px;
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .download-content .download-hint { margin-bottom: 0; }
    .download-content code {
      background: #ffffff;
      border: 1px solid #f0d49b;
      border-radius: 4px;
      padding: 0 4px;
      font-size: 0.78rem;
      color: var(--navy);
    }
    .download-content .btn-row {
      justify-content: flex-start;
      margin-top: 10px;
      gap: 8px;
    }
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      transition: background 0.15s ease;
    }
    .download-btn:hover { background: var(--accent-hover); }
    .iframe-wrap.has-download { height: auto; min-height: 100%; }
    .iframe-wrap.has-download iframe { height: 70vh; flex: none; }
    .iframe-blocked {
      max-width: 680px;
      margin: 36px auto;
      padding: 32px 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    .iframe-blocked .icon { font-size: 2.2rem; margin-bottom: 10px; }
    .iframe-blocked h3 { margin: 0 0 8px; font-size: 1.1rem; color: var(--navy); font-weight: 800; }
    .iframe-blocked p { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
    .iframe-blocked code {
      background: #f1f5f9;
      border-radius: 4px;
      padding: 1px 5px;
      color: var(--navy);
      font-size: 0.82em;
    }

    /* Placeholder */
    .placeholder {
      max-width: 680px;
      margin: 48px auto;
      padding: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    .placeholder .icon { font-size: 2.6rem; margin-bottom: 12px; }
    .placeholder h3 { margin: 0 0 8px 0; font-size: 1.15rem; color: var(--navy); font-weight: 800; }
    .placeholder p { color: var(--muted); font-size: 0.9rem; line-height: 1.55; }
    .cmd-box {
      text-align: left;
      background: #0f172a;
      color: #f8fafc;
      padding: 14px 16px;
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      margin: 18px 0;
      overflow-x: auto;
    }
    .btn-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .empty-state {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* Home cinema */
    .home-cinema {
      --home-tile-w: clamp(150px, 14vw, 300px);
      position: relative;
      display: flex;
      align-items: center;
      min-height: calc(100vh - 138px);
      overflow: hidden;
      background: #eaf1f9;
    }
    .home-mosaic {
      position: absolute;
      inset: -6%;
      overflow: hidden;
      pointer-events: none;
    }
    .home-mosaic-grid {
      position: absolute;
      left: 50%;
      top: 50%;
      display: grid;
      grid-template-columns: repeat(8, var(--home-tile-w));
      gap: 14px;
      transform: translate(-50%, -50%) perspective(1500px) rotateX(20deg) rotateZ(-8deg) scale(1.08);
      transform-origin: center;
      animation: homeMosaicDrift 34s ease-in-out infinite alternate;
    }
    .home-tile {
      display: block;
      width: var(--home-tile-w);
      aspect-ratio: 460 / 300;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 12px;
      background-size: cover;
      background-position: var(--pos, 50% 50%);
      box-shadow: 0 16px 34px rgba(9, 49, 92, 0.2);
      opacity: 0;
      animation: homeTileIn 0.6s cubic-bezier(0.215, 0.61, 0.355, 1) var(--delay, 0s) forwards;
    }
    @keyframes homeTileIn {
      0% {
        opacity: 0;
        transform: translateY(-46px) translateZ(160px) scale(0.93);
        filter: blur(9px) saturate(0.65);
      }
      100% {
        opacity: 1;
        transform: translateY(0) translateZ(0) scale(1);
        filter: blur(0) saturate(0.92) contrast(1.02);
      }
    }
    @keyframes homeMosaicDrift {
      from {
        transform: translate(-50%, -50%) perspective(1500px) rotateX(20deg) rotateZ(-8deg) scale(1.06) translate3d(-1.2%, -1%, 0);
      }
      to {
        transform: translate(-50%, -50%) perspective(1500px) rotateX(20deg) rotateZ(-8deg) scale(1.12) translate3d(1.2%, 1%, 0);
      }
    }
    .home-shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(244, 247, 251, 0.99) 0%, rgba(244, 247, 251, 0.97) 34%, rgba(244, 247, 251, 0.9) 52%, rgba(244, 247, 251, 0.55) 68%, rgba(244, 247, 251, 0.12) 88%, rgba(244, 247, 251, 0) 100%),
        linear-gradient(0deg, rgba(244, 247, 251, 0.96) 0%, rgba(244, 247, 251, 0) 32%);
    }
    .home-cinema-content {
      position: relative;
      z-index: 2;
      width: min(680px, 52vw);
      margin-left: max(28px, 6vw);
      padding: 32px 0 52px;
      animation: homeContentIn 0.8s cubic-bezier(0.215, 0.61, 0.355, 1) 0.12s backwards;
    }
    @keyframes homeContentIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }
    .home-cinema-logo {
      display: block;
      width: min(250px, 58%);
      height: auto;
      margin-bottom: 20px;
      filter: drop-shadow(0 10px 24px rgba(9, 49, 92, 0.16));
    }
    .home-kicker {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .home-cinema-content h2 {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: clamp(1.6rem, 2.6vw, 2.25rem);
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }
    .home-cinema-content > p {
      margin: 0 0 20px;
      max-width: 600px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.65;
    }
    .home-cinema-content .home-stats {
      max-width: 680px;
      margin-bottom: 18px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .home-cinema-content .stat-pill {

    .home-scroll-cue {

    @media (prefers-reduced-motion: reduce) {

      .home-cinema-content,

    /* Home / Welcome View */
    .home-container {
      max-width: 960px;
      margin: 28px auto;
      padding: 0 24px 48px 24px;
    }
    .home-hero {
      background: var(--surface);

      border-radius: var(--radius);

    .home-hero h2 {

    .home-hero p {

    .home-stats {

    .stat-pill {

    }
    .stat-pill strong {

      color: var(--accent);

    }
    .stat-pill span {

    .home-video-card {

      border-radius: 10px;

    /* Jury mode */
    .jury-panel {
      display: none;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      background: var(--surface);
      border-left: 1px solid var(--border);

    }
    body.jury-mode .layout {
      grid-template-columns: 280px minmax(0, 1fr) 400px;
    }
    body.jury-mode .jury-panel { display: flex; }
    .jury-mobile-btn { display: none; }
    .jury-close {
      display: none;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: 1px solid var(--border);

      background: var(--surface);
      color: var(--navy);

    .jury-head {

    }
    .jury-head-row {

      align-items: center;
      gap: 8px;
    }
    .jury-kicker {

      color: var(--accent);
    }
    .jury-total {
      margin-left: auto;
      padding: 3px 12px;
      border-radius: 999px;
      background: var(--accent-soft);

      font-weight: 800;
      font-variant-numeric: tabular-nums;

      line-height: 1.4;
    }
    .jury-tools-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .jury-flag-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .jury-flag-btn:hover { border-color: #fdba74; color: #ac5700; }
    .jury-flag-btn.active {
      border-color: #fdba74;
      background: #fff7ed;
      color: #ac5700;
    }
    .jury-menu { position: relative; margin-left: auto; }
    .jury-menu summary {
      list-style: none;
      cursor: pointer;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      user-select: none;
    }
    .jury-menu summary::-webkit-details-marker { display: none; }
    .jury-menu summary:hover { border-color: var(--accent); color: var(--accent); }
    .jury-menu > div {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      z-index: 30;
      min-width: 220px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow-md);
    }
    .jury-menu button {
      display: block;
      width: 100%;
      padding: 8px 9px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
    }
    .jury-menu button:hover { background: var(--surface-3); color: var(--accent); }
    .jury-progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .jury-progress {
      flex: 1;
      height: 7px;
      border-radius: 999px;
      background: var(--surface-3);
      overflow: hidden;
    }
    .jury-progress span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.25s ease;
    }
    .jury-progress-text {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .jury-save {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.7rem;
    }
    .jury-save.dirty { color: #ac5700; }
    .jury-form {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg);
    }
    .jury-criterion {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .jury-criterion-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .jury-criterion-title {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      min-width: 0;
    }
    .jury-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 800;
    }
    .jury-criterion h4 {
      margin: 0;
      color: var(--navy);
      font-size: 0.82rem;
      font-weight: 800;
      line-height: 1.35;
    }
    .jury-criterion-score {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .jury-hint {
      margin: 5px 0 8px;
      color: var(--muted);
      font-size: 0.71rem;
      line-height: 1.45;
    }
    .jury-score-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .jury-score {
      padding: 7px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--navy);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.13s ease;
    }
    .jury-score:hover { border-color: var(--accent); color: var(--accent); }
    .jury-score.selected {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(25, 114, 210, 0.28);
    }
    .jury-comment,
    .jury-global textarea {
      width: 100%;
      margin-top: 8px;
      padding: 8px 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.76rem;
      line-height: 1.45;
      resize: vertical;
    }
    .jury-comment:focus,
    .jury-global textarea:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px rgba(25, 114, 210, 0.1);
    }
    .jury-global {
      padding: 14px 2px 0;
      border-top: 1px dashed var(--border);
    }
    .jury-global label {
      display: block;
      color: var(--navy);
      font-size: 0.78rem;
      font-weight: 800;
    }
    .jury-global textarea { margin-top: 6px; }
    .jury-empty {
      padding: 38px 18px;
      color: var(--muted);
      text-align: center;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .jury-empty-icon { font-size: 2rem; margin-bottom: 8px; }
    .jury-empty strong { display: block; color: var(--navy); margin-bottom: 4px; }
    .jury-empty p { margin: 0; }
    .jury-foot {
      flex: 0 0 auto;
      display: flex;
      gap: 6px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
    }
    .jury-foot button {
      flex: 1;
      padding: 8px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--navy);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .jury-foot button:hover { border-color: var(--accent); color: var(--accent); }
    .jury-foot .jury-next-unrated {
      flex: 1.5;
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }
    .jury-foot .jury-next-unrated:hover { background: var(--accent-hover); color: #ffffff; }
    .jury-status {
      padding: 2px 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .jury-status.todo { background: #f1f5f9; color: #52657a; border-color: #dce5f0; }
    .jury-status.partial { background: #fff8e8; color: #ac5700; border-color: #f0d49b; }
    .jury-status.done { background: #edfcf2; color: #087443; border-color: #bbf7d0; }

    /* Jury synthesis modal */
    .jury-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(9, 49, 92, 0.45);
    }
    .jury-modal.open { display: flex; }
    .jury-modal-card {
      display: flex;
      flex-direction: column;
      width: min(1120px, 100%);
      max-height: 86vh;
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 24px 60px rgba(9, 49, 92, 0.3);
      overflow: hidden;
    }
    .jury-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .jury-modal-head h2 {
      margin: 0;
      color: var(--navy);
      font-size: 1.05rem;
      font-weight: 800;
    }
    .jury-modal-close {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--navy);
      cursor: pointer;
    }
    .jury-modal-body {
      padding: 16px 20px 24px;
      overflow: auto;
    }
    .jury-summary-note {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .jury-summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    .jury-summary-table th,
    .jury-summary-table td {
      padding: 8px 7px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    .jury-summary-table th {
      position: sticky;
      top: 0;
      background: var(--surface-2);
      color: var(--navy);
      font-weight: 800;
      white-space: nowrap;
    }
    .jury-summary-table td.num {
      text-align: center;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .jury-summary-sub {
      color: var(--muted);
      font-size: 0.72rem;
    }

    .mobile-drawer-btn {
      display: none;
      width: 100%;
      padding: 12px 16px;
      background: var(--surface);
      border: 0;
      border-bottom: 1px solid var(--border);
      color: var(--navy);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      align-items: center;
      justify-content: space-between;
    }

    @media (max-width: 1250px) and (min-width: 961px) {
      body.jury-mode .layout {
        grid-template-columns: 250px minmax(0, 1fr) 370px;

      }

      }

      }
      .home-scroll-cue { display: none; }
      .home-container, .doc-container, .video-container {

      .home-hero {

  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a class="brand" href="#" onclick="showHome(); return false;" title="Retour à l'accueil">
        <img src="https://www.iledefrance-mobilites.fr/idfm-logo.svg" alt="Île-de-France Mobilités" onerror="this.style.display='none'" />

  </header>

    function renderHomeMosaicTiles() {
      const groups = HOME_MOSAIC_GROUPS.map(group => group.slice());
      const files = [];
      let index = 0;
      while (files.length < 48 && groups.some(group => group.length)) {
        const group = groups[index % groups.length];
        if (group.length) files.push(group.shift());
        index++;
      }
      const positions = ["50% 45%", "32% 55%", "68% 42%"];
      return files.map((file, i) => {
        const col = i % 8;
        const row = Math.floor(i / 8);
        const delay = (row * 0.055 + col * 0.028).toFixed(3);
        const pos = positions[i % positions.length];
        const url = localFileUrl("assets/mosaic", `${file}.webp`);
        return `<span class="home-tile" style="--delay:${delay}s;--pos:${pos};background-image:url('${url}')"></span>`;
      }).join("");
    }

      return String(value == null ? "" : value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"

    function ensureJuryEntry(teamNum) {
      if (!juryData[teamNum] || typeof juryData[teamNum] !== "object") {
        juryData[teamNum] = { scores: {}, comments: {}, global: "", flag: false, updatedAt: null };
      }
      const entry = juryData[teamNum];
      if (!entry.scores || typeof entry.scores !== "object") entry.scores = {};
      if (!entry.comments || typeof entry.comments !== "object") entry.comments = {};
      if (typeof entry.global !== "string") entry.global = "";
      if (typeof entry.flag !== "boolean") entry.flag = false;
      return entry;
    }

    function juryScoreCount(entry) {
      if (!entry || !entry.scores) return 0;
      return JURY_CRITERIA.reduce((count, criterion) => {
        return count + (typeof entry.scores[criterion.key] === "number" ? 1 : 0);
      }, 0);
    }

    function juryTotal(entry) {
      if (!entry || !entry.scores) return 0;
      return JURY_CRITERIA.reduce((total, criterion) => {
        return total + (typeof entry.scores[criterion.key] === "number" ? entry.scores[criterion.key] : 0);
      }, 0);
    }

    function juryIsComplete(entry) {
      return juryScoreCount(entry) === JURY_CRITERIA.length;
    }

    function juryStatusInfo(teamNum) {
      const entry = juryData[teamNum];
      const count = juryScoreCount(entry);

      if (count < JURY_CRITERIA.length) return { cls: "partial", label: `◐ ${count}/5${flag}` };
      return { cls: "done", label: `● ${juryTotal(entry)}/20${flag}` };
    }

      const p = PROJECTS.find(x => x.teamNum === selectedTeam);

      const entry = ensureJuryEntry(p.teamNum);
      if (entry.scores[key] === value) delete entry.scores[key];
      else entry.scores[key] = value;
      entry.updatedAt = new Date().toISOString();
      rerenderJuryPanelKeepingScroll();
      renderList();
      scheduleJurySave();

      const p = PROJECTS.find(x => x.teamNum === selectedTeam);

      entry.comments[key] = value;

    function juryNavigate(delta) {
      const items = filteredProjects();
      if (!items.length) return;
      let index = items.findIndex(p => p.teamNum === selectedTeam);
      if (index === -1) index = 0;
      const next = items[index + delta];
      if (next) selectProject(next.teamNum);
    }

    function juryNextUnrated() {
      const items = filteredProjects();
      if (!items.length) return;
      const start = Math.max(0, items.findIndex(p => p.teamNum === selectedTeam));
      const ordered = [...items.slice(start + 1), ...items.slice(0, start + 1)];
      const next = ordered.find(p => !juryIsComplete(juryData[p.teamNum]));
      if (next) selectProject(next.teamNum);
      else alert("Tous les projets affichés sont notés.");
    }

    function downloadFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function juryDateStamp() {
      return new Date().toISOString().slice(0, 10);
    }

    function exportJuryJSON() {
      const payload = {
        version: 1,
        exportedAt: new Date().toISOString(),
        projects: juryData
      };
      downloadFile(
        `notes-jury-hackaviz-2026-${juryDateStamp()}.json`,
        JSON.stringify(payload, null, 2),
        "application/json"
      );
    }

    function csvCell(value) {
      const str = value == null ? "" : String(value);
      return `"${str.replace(/"/g, '""')}"`;

    function exportJuryCSV() {
      const header = [
        "Équipe",
        "Projet",
        ...JURY_CRITERIA.map(c => c.label),
        "Total /20",
        ...JURY_CRITERIA.map(c => `Commentaire — ${c.label}`),
        "Commentaire général",
        "À revoir",
        "Dernière modification"
      ];
      const rows = [header];
      PROJECTS.forEach(p => {
        const entry = juryData[p.teamNum] || {};
        const scores = entry.scores || {};
        const comments = entry.comments || {};
        rows.push([
          p.teamNum,
          p.title,
          ...JURY_CRITERIA.map(c => typeof scores[c.key] === "number" ? scores[c.key] : ""),
          juryIsComplete(entry) ? juryTotal(entry) : "",
          ...JURY_CRITERIA.map(c => comments[c.key] || ""),
          entry.global || "",
          entry.flag ? "oui" : "non",
          entry.updatedAt ? new Date(entry.updatedAt).toLocaleString("fr-FR") : ""
        ]);
      });
      const csv = "\uFEFF" + rows.map(row => row.map(csvCell).join(";")).join("\r\n");
      downloadFile(
        `notes-jury-hackaviz-2026-${juryDateStamp()}.csv`,
        csv,
        "text/csv;charset=utf-8"
      );
    }

    function importJuryFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          const imported = parsed && parsed.projects ? parsed.projects : parsed;
          if (!imported || typeof imported !== "object" || Array.isArray(imported)) {
            throw new Error("invalid");
          }
          if (!confirm("Remplacer les notes locales par les notes de ce fichier ?")) return;
          juryData = imported;
          saveJuryData();
          renderList();
          renderJuryPanel();
        } catch (err) {
          alert("Fichier JSON invalide ou illisible.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    async function loadReadme(p) {
      const url = localFileUrl(p.folder, p.readme);
      if (readmeCache.has(url)) return readmeCache.get(url);
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const md = await res.text();
        readmeCache.set(url, { ok: true, md });
        return { ok: true, md };
      } catch (err) {
        return { ok: false, err: err.message };
      }
    }

    function renderMarkdown(md, folder) {
      if (typeof marked === "undefined") {
        return `<pre style="white-space:pre-wrap;">${md.replace(/</g, "&lt;")}</pre>`;
      }
      const html = marked.parse(md);
      const doc = new DOMParser().parseFromString(html, "text/html");
      // Fix relative image src so screenshots inside READMEs load when served from /home/onyxia/work
      doc.querySelectorAll("img").forEach(img => {
        const src = img.getAttribute("src");
        if (src && !src.startsWith("http") && !src.startsWith("data:")) {
          img.setAttribute("src", localFileUrl(folder, src.replace(/^\.\//, "")));
        }
      });
      doc.querySelectorAll("a").forEach(a => {
        const href = a.getAttribute("href");
        if (href && !href.startsWith("http") && !href.startsWith("#") && !href.startsWith("mailto:")) {
          a.setAttribute("href", ghFolderUrl(folder) + "/" + href.replace(/^\.\//, ""));
        }
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener");
      });
      return doc.body.innerHTML;
    }

          stageEl.innerHTML = `
            <div class="placeholder">
              <div class="icon">⚙️</div>
              <h3>Dataviz nécessitant un backend ou un outil local</h3>
              <p>${p.reason}</p>
              <div class="cmd-box"><pre style="margin:0;">${p.runCmd}</pre></div>
              <div class="btn-row">
                ${p.altUrl ? `<a class="tab-btn active" style="text-decoration:none;" href="${p.altUrl}" target="_blank" rel="noopener">${p.altLabel} ↗</a>` : ""}
                ${p.videoPath ? `<button class="tab-btn active" onclick="setMode('video')">🎬 Voir la vidéo de démo</button>` : ""}
                <a class="ext-link" href="${ghFolderUrl(p.folder)}" target="_blank" rel="noopener">Voir les fichiers sur GitHub ↗</a>
              </div>
            </div>
          `;
        }
      }
    }

    function toggleMobileList(forceState) {
      const open = typeof forceState === "boolean"
        ? forceState
        : !listEl.classList.contains("open");
      listEl.classList.toggle("open", open);
      document.getElementById("mobileDrawerArrow").textContent = open ? "▴" : "▾";
    }

    function updateMobileLabel() {
      const lbl = document.getElementById("mobileDrawerLabel");
      if (!lbl) return;
      if (selectedTeam === null) {
        const count = filteredProjects().length;
        lbl.textContent = `📋 Choisir une équipe (${count})`;
      } else {
        const p = PROJECTS.find(x => x.teamNum === selectedTeam);
        lbl.textContent = p ? `📋 Équipe ${p.teamNum} · ${p.teamName} (changer)` : "📋 Choisir une équipe";
      }
    }

    function selectProject(num) {
      selectedTeam = num;
      try {
        sessionStorage.setItem(JURY_SESSION_KEY, String(num));
      } catch (err) {}
      toggleMobileList(false);
      updateMobileLabel();
      renderList();
      renderStage();
      renderJuryPanel();
    }

    function setMode(nextMode) {
      mode = nextMode;
      renderStage();
    }

    document.querySelectorAll(".pill").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pill").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeDefi = btn.dataset.defi;
        const items = filteredProjects();
        if (items.length && !items.some(x => x.teamNum === selectedTeam)) {
          selectedTeam = items[0].teamNum;
          try {
            sessionStorage.setItem(JURY_SESSION_KEY, String(selectedTeam));
          } catch (err) {}
        }
        updateMobileLabel();
        renderList();
        renderStage();
        renderJuryPanel();
      });
    });

    document.getElementById("searchInput").addEventListener("input", e => {
      searchQuery = e.target.value;
      updateMobileLabel();
      renderList();
    });

    window.addEventListener("beforeunload", () => {
      if (jurySaveTimer) saveJuryData();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeJurySummary();
        toggleJuryPanel(false);
      }
      if (!juryMode) return;
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        event.preventDefault();
        juryNavigate(1);
      }
    });

    const jurySummaryEl = document.getElementById("jurySummary");
    if (jurySummaryEl) {
      jurySummaryEl.addEventListener("click", event => {
        if (event.target === jurySummaryEl) closeJurySummary();
      });
    }

    syncJuryModeUI();
    renderList();
    renderStage();
    renderJuryPanel();
  </script>
</body>
</html>
