<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dégradés</title>
  <style>
    html, body { margin: 0; background: #fff; color: #000; }
    body {
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      padding: 40px 32px 64px;
    }
    section { margin: 0 0 48px; }
    p { margin: 0 0 12px; font-size: 22px; font-weight: 650; }
    .barre { height: 168px; width: 100%; }
    .bouts {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <section>
    <p>1. Ocre.</p>
    <div class="barre" style="background: linear-gradient(90deg, #F6E3A1, #E0A04A, #3E4C59)"></div>
    <div class="bouts"><span>Exposé</span><span>Ombragé</span></div>
  </section>
  <section>
    <p>2. Île-de-France Mobilités.</p>
    <div class="barre" style="background: linear-gradient(90deg, #F4D27A, #5BA3D9, #0055A4)"></div>
    <div class="bouts"><span>Exposé</span><span>Ombragé</span></div>
  </section>
  <section>
    <p>3. RATP.</p>
    <div class="barre" style="background: linear-gradient(90deg, #F6E7C1, #7BC47F, #00843D)"></div>
    <div class="bouts"><span>Exposé</span><span>Ombragé</span></div>
  </section>
  <section>
    <p>4. Ocre, bleu, vert.</p>
    <div class="barre" style="background: linear-gradient(90deg, #F2C14E, #0072CE, #006B3F)"></div>
    <div class="bouts"><span>Exposé</span><span>Ombragé</span></div>
  </section>
</body>
</html>
