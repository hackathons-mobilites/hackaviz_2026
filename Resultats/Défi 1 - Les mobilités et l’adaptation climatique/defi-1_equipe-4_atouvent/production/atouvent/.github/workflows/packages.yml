# Publication des images Docker dans GitHub Packages (ghcr.io), après réussite des tests :
#   ghcr.io/bricebokatola/atouvent-api  (API et collecteur)
#   ghcr.io/bricebokatola/atouvent-web  (site web servi par nginx)
# Étiquettes : « latest » et l'empreinte du commit sur main ; le numéro de version pour une étiquette git v1.2.3.
name: Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  image:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: atouvent-api
            context: backend
          - name: atouvent-web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
