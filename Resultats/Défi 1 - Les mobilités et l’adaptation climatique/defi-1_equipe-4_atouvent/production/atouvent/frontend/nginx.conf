# Site AtouVent : application monopage, cache long pour les fichiers versionnés, relais /api vers le conteneur « api ».
# Le HTTPS est assuré devant (proxy inverse ou hébergeur) ; HSTS y est ajouté.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # En-têtes de sécurité (la politique de contenu CSP est dans index.html)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API : même origine que le site (le cookie de session SameSite=Strict fonctionne sans CORS)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;          # flux en direct (Server-Sent Events)
        proxy_read_timeout 1h;
        client_max_body_size 1m;
    }

    # Fichiers avec empreinte dans le nom : gardés un an
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Service worker et manifeste : toujours relus (mises à jour de l'application)
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Application monopage : toute autre adresse sert index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
