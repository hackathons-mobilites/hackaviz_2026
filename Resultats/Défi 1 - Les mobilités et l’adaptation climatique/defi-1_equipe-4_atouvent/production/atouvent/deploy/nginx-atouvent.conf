# atouvent.com sur un serveur où nginx sert déjà d'autres sites : à copier dans /etc/nginx/sites-available/atouvent.com
# puis lien dans sites-enabled ; « certbot --nginx -d atouvent.com -d www.atouvent.com » ajoute ensuite le HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name atouvent.com www.atouvent.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # Flux en direct (Server-Sent Events) : pas de mise en mémoire tampon, connexion longue
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
